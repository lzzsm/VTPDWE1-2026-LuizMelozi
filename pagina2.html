<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabelas com colspan e rowspan</title>
    <style>
        table, th, td {
            border: 1px solid #ff6961;
            text-align: center;
        }

        td {
            padding: 25px 40px;
        }

        table {
            margin-bottom: 30px;
            border-spacing: 2px; 
        }

        .titulo-tabela {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            font-family: serif;
        }
    </style>
    <link rel="icon" href="tabela.png" type="image/png">
</head>
<body>

    <h1>Página 2 - Tabelas com colspan e rowspan</h1>


    <div class="titulo-tabela">Tabela com colspan</div>
    <table>
        <tbody>
            <tr>
                <td colspan="3">Colspan</td>
            </tr>
            <tr>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            </tr>
        </tbody>
    </table>


    <div class="titulo-tabela">Tabela com rowspan</div>
    <table>
        <tbody>
            <tr>
                <td>-</td>
                <td rowspan="3">Rowspan</td>
            </tr>
            <tr>
                <td>-</td>
            </tr>
            <tr>
                <td>-</td>
            </tr>
        </tbody>
    </table>


    <div class="titulo-tabela">Tabela com colspan e rowspan</div>
    <table>
        <tbody>
            <tr>
                <td colspan="2">Colspan</td>
                <td>-</td>
                <td rowspan="3">Rowspan</td>
            </tr>
            <tr>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            </tr>
            <tr>
                <td>-</td>
                <td colspan="2">Colspan</td>
            </tr>
            <tr>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            </tr>
        </tbody>
    </table>

    <br>
    <a href="index.html">Voltar ao menu principal</a>

</body>
</html>
